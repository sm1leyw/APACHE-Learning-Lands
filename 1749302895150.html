<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        border: 0;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --hue: 223;
        --sat: 10%;
        --white: hsl(0, 0%, 100%);
        --gray100: hsl(var(--hue), var(--sat), 90%);
        --gray200: hsl(var(--hue), var(--sat), 80%);
        --gray700: hsl(var(--hue), var(--sat), 30%);
        --gray800: hsl(var(--hue), var(--sat), 20%);
        --gray900: hsl(var(--hue), var(--sat), 10%);
        --gray950: hsl(var(--hue), var(--sat), 5%);
        --trans-dur: 0.3s;
        color-scheme: light dark;
        font-size: clamp(0.75rem, 0.7rem + 0.25vw, 1rem);
      }

      body {
        background-color: #000;
        color: light-dark(var(--gray900), var(--gray100));
        display: grid;
        place-items: center;
        font: 1em/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          Helvetica, sans-serif;
        height: 100vh;
        overflow-x: hidden;
        transition: background-color var(--trans-dur), color var(--trans-dur);
      }

      .avatar {
        aspect-ratio: 1;
        background-color: light-dark(var(--gray100), var(--gray700));
        border-radius: 50%;
        font-size: 2.5em;
        line-height: 1;
        display: grid;
        place-items: center;
        text-align: center;
        width: 100%;
        transition: background-color var(--trans-dur);
      }

      .note {
        height: 5.75em;
      }

      .note,
      .note__inner {
        animation-duration: 0.75s;
        animation-fill-mode: forwards;
      }

      .note__inner {
        animation-name: note-in;
        background-color: light-dark(var(--white), var(--gray800));
        border-radius: 1em;
        box-shadow: 0 0 1.5em rgba(0, 0, 0, 0.1);
        display: grid;
        grid-template-columns: 3.75em 1fr;
        gap: 1em;
        padding: 1em;
        padding-inline-end: 2em;
        width: 100%;
        max-width: 26em;
        transform-origin: 50% 100%;
        transition: background-color var(--trans-dur),
          box-shadow var(--trans-dur);
      }
      .note__content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }
      .note__message {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .note__title {
        font-size: 1em;
        font-weight: 600;
      }

      
      .note--out {
        animation-name: note-shrink;
      }


      .note--out .note__inner {
        animation-name: note-out;
        transform-origin: 50% 50%;
      }


      .note-center {
        display: flex;
        gap: 0.75em;
        flex-direction: column;
        align-items: center;
        padding: 0 1.5em;
        width: 100vw;
      }

      /* Animations */
      @keyframes note-in {
        from {
          filter: blur(10px);
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          filter: blur(0);
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes note-out {
        from {
          filter: blur(0);
          opacity: 1;
          transform: translateY(0) scale(1);
        }
        to {
          filter: blur(10px);
          opacity: 0;
          transform: translateY(-100%) scale(1.1);
        }
      }
      @keyframes note-shrink {
        from {
          height: 5.75em;
        }
        to {
          height: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module">
      import React, {
        StrictMode,
        useCallback,
        useEffect,
        useRef,
        useState,
      } from "https://esm.sh/react";
      import { createRoot } from "https://esm.sh/react-dom/client";
      import { Flipper, Flipped } from "https://esm.sh/react-flip-toolkit";
      import { faker } from "https://esm.sh/@faker-js/faker";
      createRoot(document.getElementById("root")).render(
        React.createElement(
          StrictMode,
          null,
          React.createElement(NotificationCenter, null)
        )
      );
      function generateNote() {
        const emojiList = {
          male: ["👱🏻‍♂️", "👨🏻", "👨🏻‍🦳", "🧔🏽‍♂️", "👨🏾", "👨🏿‍🦱", "👨🏿‍🦲"],
          female: ["👱🏻‍♀️", "👩🏻", "👩🏻‍🦳", "👩🏽", "👩🏽‍🦱", "👧🏿", "👩🏿"],
        };
        const randomHue = faker.number.int({ max: 359 });
        const sex = faker.person.sex();
        const emojisBySex = emojiList[sex];
        const emojiIndex = faker.number.int({ max: emojisBySex.length - 1 });
        const user = {
          color: `hsl(${randomHue}, 90%, 90%)`,
          emoji: emojisBySex[emojiIndex],
          name: faker.person.fullName({ sex }),
        };
        return {
          id: faker.string.uuid(),
          user,
          message: faker.hacker.phrase(),
        };
      }
      function Avatar({ color, emoji }) {
        const colorStyle = {
          backgroundColor: color,
        };
        return React.createElement(
          "div",
          { className: "avatar", style: colorStyle },
          emoji
        );
      }
      function Notification({ user, message, fadingOut }) {
        const noteClass = `note${fadingOut ? " note--out" : ""}`;
        return React.createElement(
          "div",
          { className: noteClass },
          React.createElement(
            "div",
            { className: "note__inner" },
            React.createElement(Avatar, {
              color: user.color,
              emoji: user.emoji,
            }),
            React.createElement(
              "div",
              { className: "note__content" },
              React.createElement(
                "h3",
                { className: "note__title" },
                user.name
              ),
              React.createElement("p", { className: "note__message" }, message)
            )
          )
        );
      }
      function NotificationCenter() {
        const [notes, setNotes] = useState([]);
        const timeoutRef = useRef(null);
        const notesMax = 3;
        const intervalMs = 1000;
        const addNote = useCallback(() => {
          setNotes((prev) => {
            if (prev.length < notesMax) {
              // allow population until max
              return [...prev, generateNote()];
            }
            // remove those faded out
            const updated = prev
              .filter((note) => !note.fadingOut)
              .map((note, i) => {
                if (i === 0) {
                  return Object.assign(Object.assign({}, note), {
                    fadingOut: true,
                  });
                }
                return note;
              });
            // add as usual
            updated.push(generateNote());
            return updated;
          });
          timeoutRef.current = setTimeout(addNote, intervalMs);
        }, []);
        useEffect(() => {
          timeoutRef.current = setTimeout(addNote, 1);
          return () => {
            if (timeoutRef.current) {
              clearTimeout(timeoutRef.current);
            }
          };
        }, []);
        return React.createElement(
          Flipper,
          { flipKey: notes.map((note) => note.id).join("") },
          React.createElement(
            "div",
            { className: "note-center" },
            notes.map((note) =>
              React.createElement(
                Flipped,
                { key: note.id, flipId: note.id },
                React.createElement(
                  "div",
                  null,
                  React.createElement(Notification, Object.assign({}, note))
                )
              )
            )
          )
        );
      }
    </script>
  </body>
</html>
