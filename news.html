<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข่าวประชาสัมพันธ์ - APACHE</title>
    <link rel="stylesheet" href="CSS/news.css">
    <link rel="stylesheet" href="CSS/global-ui.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--ui-page-bg); 
            color: var(--ui-text);
            transition: background 0.35s, color 0.35s;
        }

        .header {
            background: var(--ui-glass-strong); 
            color: var(--ui-text); 
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .card {
            background: var(--ui-home-card);
            color: var(--ui-text);
            border: 1px solid var(--ui-border);
            
        }
        .main-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid #333; /* ความหนา รูปแบบ สี */
            box-shadow: 5px 5px 10px rgba(0,0,0,0.5); /* เงา */
         }

         .back-home {
            font-size: 14px;
            color: var(--ui-text);
            text-decoration: none;
            padding: 8px 16px;
            border: 2px solid var(--ui-text);
            border-radius: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-right: 135px;
        }
        .logo-text {
            color: var(--ui-text);
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-group">
        <img src="CSS/contact picture/Apache.png" alt="Logo" class="main-logo">
        <div class="logo-text">APACHE Learning</div>
    </div>
    
    <div class="nav">
        <a href="index.html" class="back-home">← กลับหน้าแรก</a>
    </div>
</div>

<div class="banner">
    <div class="banner-left">
        <h1>ข่าวประชาสัมพันธ์</h1>
        <p class="news-label">NEWS</p>
    </div>
    <div class="banner-right"></div>
</div>

<div class="news-container">
    <h2 class="section-title">ประกาศล่าสุด</h2>
    <div class="news-grid">
        <div class="card">
            <img src="CSS/contact picture/boss.png" alt="Boss Update">
            <div class="card-body">
                <h3>ประกาศสำคัญเรื่องการเรียน</h3>
                <p>อัปเดต New Boss เวอร์ชั่นล่าสุด พร้อมรายละเอียดการเรียนการสอนใหม่</p>
            </div>
        </div>
    </div>
</div>

<a href="contact.html" class="btn-contact-fixed">ติดต่อเรา</a>

</body>
    <script src="JS/global-ui.js"></script>
</html>
